name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Sem segredo real nenhum aqui: build/lint/typecheck não fazem chamada de rede
# ao Supabase, só precisam de algo para `process.env.NEXT_PUBLIC_SUPABASE_URL!`
# não ser undefined na hora de construir o cliente.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  NEXT_PUBLIC_SITE_URL: https://placeholder.example.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Testes de ponta a ponta (npm run testar:prova / testar:banco / testar:conta)
  # rodam contra o projeto Supabase de PRODUÇÃO de verdade (mesmo banco do
  # AGENTS.md) — não em cada push, só sob demanda, e exigem os três segredos
  # abaixo cadastrados em Settings > Secrets and variables > Actions:
  #   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
  #   SUPABASE_SERVICE_ROLE_KEY (mesmos valores do .env.local).
  testes-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run testar:conta
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm run testar:banco
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # testar:acesso bate de verdade em /api/webhooks/lowify, então precisa
      # do app rodando — builda e sobe em produção local, roda o teste, mata
      # o servidor. Exige também o segredo LOWIFY_WEBHOOK_SECRET (o mesmo do
      # .env.local) cadastrado nos secrets do repositório.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: |
          npm run start &
          npx wait-on http://localhost:3000/login
          npm run testar:acesso
          kill %1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOWIFY_WEBHOOK_SECRET: ${{ secrets.LOWIFY_WEBHOOK_SECRET }}
